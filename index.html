<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->
    <link rel="stylesheet" href="style.css" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png" />

    <title>Frontend Mentor | [Challenge Name Here]</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <style>
      .attribution {
        font-size: 11px;
        text-align: center;
      }
      .attribution a {
        color: hsl(228, 45%, 44%);
      }
    </style>
  </head>
  <body>
    <img src="/images/bg-top.svg" class="svg-top-1" />
    <h1>Our Pricing</h1>
    <div class="annual-monthly-container">
      <p class="annually">Annually</p>
      <label class="switch">
        <input type="checkbox" id="swgit initial-scale />
        <span class="slider round"></span>
      </label>
      <p class="monthly">Monthly</p>
    </div>
    <div class="price-con">
      <div class="monthly-1">
        <div class="con1">
          <p>Basic</p>
          <p id="price1">&dollar;199.99</p>
          <hr />
          <p>500 GB Storage</p>
          <hr />
          <p>2 Users Allowed</p>
          <hr />
          <p>Send up to 3 GB</p>
          <hr />
          <button class="button1">Learn More</button>
        </div>
      </div>
      <div class="monthly-2">
        <p>Professional</p>
        <p id="price2">&dollar;249.99</p>
        <hr />
        <p>1 TB Storage</p>
        <hr />
        <p>5 Users Allowed</p>
        <hr />
        <p>Send up to 10 GB</p>
        <hr />
        <button class="button2">Learn More</button>
      </div>
      <div class="monthly-3">
        <p>Master</p>
        <p id="price3">&dollar;399.99</p>
        <hr />
        <p>2 TB Storage</p>
        <hr />
        <p>10 Users Allowed</p>
        <hr />
        <p>Send up to 20 GB</p>
        <hr />
        <button class="button3">Learn More</button>
      </div>
    </div>
    <div class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge" target="_blank"
        >Frontend Mentor</a
      >. Coded by <a href="#">Your Name Here</a>.
    </div>
    <img src="/images/bg-bottom.svg" class="svg-bottom-1" />
    <script src="index.js"></script>
  </body>
</html>
